name: Daily website refresh
on:
  schedule:
    # 01:00 Chicago is 06:00 UTC in daylight time, 07:00 UTC in standard time.
    # The second wake is also a delayed/missed-run catch-up; the date ledger
    # suppresses the duplicate, including the repeated hour at the DST fall-back.
    - cron: '0 6,7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      active: ${{ steps.gate.outputs.active }}
      source_sha: ${{ steps.journal.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
        id: dependencies
      - name: Local-time and once-per-day gate
        id: gate
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = 'true' ]; then
            python -m civic_tracker.daily gate --manual >> "$GITHUB_OUTPUT"
          else
            python -m civic_tracker.daily gate >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.active == 'true'
        run: python -m unittest discover -s tests -v
        id: tests
      - name: Refresh official sources without inference or email
        id: collector
        if: steps.gate.outputs.active == 'true'
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESSGOV_API || secrets.CONGRESS_API_KEY }}
        run: python -m civic_tracker.daily run
      - name: Record official and hearing changes without inference
        if: steps.gate.outputs.active == 'true'
        id: official_changes
        run: python -m civic_tracker.changes collect
      - name: Discover public news and reserve bounded inference budget
        if: steps.gate.outputs.active == 'true'
        run: python -m civic_tracker.media prepare
      - name: Persist budget reservations before any paid request
        id: reserve
        if: steps.gate.outputs.active == 'true'
        run: |
          python -m civic_tracker.privacy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve bounded media screening and preserve source metadata'
            git push origin main
          fi
      - name: Screen supplied article IDs using the capped media model
        id: model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        if: steps.gate.outputs.active == 'true'
        run: python -m civic_tracker.media execute
      - if: steps.gate.outputs.active == 'true'
        run: python -m civic_tracker.changes collect
        id: changes
      - if: steps.gate.outputs.active == 'true'
        run: python -m civic_tracker.privacy
        id: privacy
      - if: steps.gate.outputs.active == 'true'
        run: python -m civic_tracker.browse --output .local/site
        id: build
      - name: Persist public data before publication
        id: persist
        if: steps.gate.outputs.active == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh daily public source records and collection health'
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.active == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site
      - name: Preserve troubleshooting journal even after a failed step
        if: always() && (steps.gate.outputs.active == 'true' || failure())
        id: journal
        uses: ./.github/actions/error-journal
        with:
          scope: daily
          status: ${{ job.status }}
          dependencies: ${{ steps.dependencies.outcome }}
          tests: ${{ steps.tests.outcome == 'failure' && 'failure' || steps.offline.outcome }}
          collector: ${{ steps.collector.outcome == 'failure' && 'failure' || steps.communications.outcome == 'failure' && 'failure' || steps.collector.outcome }}
          reserve: ${{ steps.reserve.outcome }}
          model: ${{ steps.model.outcome }}
          changes: ${{ steps.official_changes.outcome == 'failure' && 'failure' || steps.changes.outcome }}
          privacy: ${{ steps.privacy.outcome }}
          build: ${{ steps.build.outcome }}
          persist: ${{ steps.persist.outcome }}
  deploy:
    needs: refresh
    if: needs.refresh.outputs.active == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject publication of an outdated artifact
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SHA: ${{ needs.refresh.outputs.source_sha }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "active=$([ "$latest" = "$ARTIFACT_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish daily website artifact
        if: steps.current.outputs.active == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
