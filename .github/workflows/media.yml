name: Refresh media reports
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.persist.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Discover public news and reserve bounded inference budget
        run: python -m civic_tracker.media prepare
      - name: Persist budget reservations before any paid request
        id: reserve
        run: |
          python -m civic_tracker.privacy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve bounded media screening and preserve source metadata'
            git push origin main
          fi
      - name: Screen supplied article IDs using the capped media model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m civic_tracker.media execute
      - run: python -m civic_tracker.privacy
      - run: python -m civic_tracker.browse --output .local/site
      - name: Persist screened reports and billing receipts before publication
        id: persist
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Publish screened recent media reports and bounded cost receipt'
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject publication of an outdated artifact
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SHA: ${{ needs.refresh.outputs.source_sha }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "active=$([ "$latest" = "$ARTIFACT_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish media website artifact
        if: steps.current.outputs.active == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
