name: Owner digest delivery
on:
  schedule:
    # Daily gate; the durable state machine sends only when three Chicago days
    # have elapsed since the last inbox-confirmed delivery.
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: digest-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Reserve due owner digest before exposing secrets
        id: reserve
        run: |
          mkdir -p .local
          set +e
          python -m civic_tracker.delivery reserve > .local/delivery-reserve.json
          code=$?
          cat .local/delivery-reserve.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Persist durable reservation
        if: steps.reserve.outputs.code == '0'
        run: |
          python -m civic_tracker.privacy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digest-delivery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve owner digest delivery attempt'
            git push origin main
          fi
      - name: Send owner-only digest and check inbox
        id: send
        if: steps.reserve.outputs.code == '0'
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python -m civic_tracker.delivery send
      - name: Persist address-free delivery receipt
        if: steps.reserve.outputs.code == '0' && steps.send.outcome != 'skipped'
        run: |
          python -m civic_tracker.privacy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digest-delivery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record owner digest delivery outcome'
            git push origin main
          fi
      - name: Enforce confirmed delivery
        if: steps.reserve.outputs.code == '0' && steps.send.outcome == 'failure'
        run: exit 1
