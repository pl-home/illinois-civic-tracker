name: Read-only OpenRouter diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
        id: dependencies
      - name: Check authentication and catalog without inference
        id: collector
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m civic_tracker.openrouter_health
      - run: python -m civic_tracker.privacy
        id: privacy
      - name: Preserve sanitized diagnostic receipt
        id: persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/openrouter-health.json
          git commit -m 'Record read-only OpenRouter health without inference'
          git push origin main
      - name: Preserve troubleshooting journal even after a failed step
        if: always()
        id: journal
        uses: ./.github/actions/error-journal
        with:
          scope: openrouter-health
          status: ${{ job.status }}
          dependencies: ${{ steps.dependencies.outcome }}
          tests: ${{ steps.tests.outcome == 'failure' && 'failure' || steps.offline.outcome }}
          collector: ${{ steps.collector.outcome == 'failure' && 'failure' || steps.communications.outcome == 'failure' && 'failure' || steps.collector.outcome }}
          reserve: ${{ steps.reserve.outcome }}
          model: ${{ steps.model.outcome }}
          privacy: ${{ steps.privacy.outcome }}
          build: ${{ steps.build.outcome }}
          persist: ${{ steps.persist.outcome }}
