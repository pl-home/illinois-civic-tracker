name: Manual bounded PDF extraction trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.persist.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[verification]"
      - run: python -m unittest discover -s tests -v
      - name: Fetch and preflight one official PDF; reserve shared budget
        run: python -m civic_tracker.pdf_extract prepare
      - name: Preserve reservation before exposing the inference key
        run: |
          python -m civic_tracker.privacy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Reserve bounded manual PDF extraction liability'
          git push origin main
      - name: One free-parser PDF request with capped DeepInfra inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m civic_tracker.pdf_extract execute
      - run: python -m civic_tracker.privacy
      - run: python -m civic_tracker.browse --output .local/site
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-source-preview
          path: .local/pdf-source-preview.png
          retention-days: 7
      - name: Preserve extraction and measured cost
        id: persist
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Record manual PDF extraction evidence and measured cost'
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject publication of an outdated artifact
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SHA: ${{ needs.refresh.outputs.source_sha }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "active=$([ "$latest" = "$ARTIFACT_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish measured PDF trial usage
        if: steps.current.outputs.active == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
