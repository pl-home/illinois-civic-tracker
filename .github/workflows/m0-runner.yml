name: M0 runner source access
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - id: probe
        run: python -m civic_tracker.probe_runner
        continue-on-error: true
      - run: python -m civic_tracker.privacy
      - name: Commit compact evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/m0-runner-access.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record M0 runner access evidence'
            git push
          fi
      - name: Enforce source access result
        if: steps.probe.outcome == 'failure'
        run: exit 1
