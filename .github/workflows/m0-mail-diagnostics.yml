name: M0 mail connection diagnostics - no send
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Check authentication without sending and search only the existing test message
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m civic_tracker.mail_diagnostics
      - name: Commit public diagnostics
        run: |
          python -m civic_tracker.privacy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/m0-mail-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record connection-only M0 mail diagnostics'
            git push
          fi
