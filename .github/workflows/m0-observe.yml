name: M0 bounded timing observations
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m civic_tracker.observe_m0
      - run: python -m civic_tracker.privacy
      - name: Commit compact observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/
          if ! git diff --cached --quiet; then
            git commit -m 'Record bounded M0 timing observation'
            git push
          fi
