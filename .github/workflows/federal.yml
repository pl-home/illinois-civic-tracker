name: Recheck federal sources
on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Read-only Duckworth source duplicate diagnostic
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: m0-source-evidence
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && inputs.diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Inspect duplicate identities without source bodies or credentials
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESSGOV_API || secrets.CONGRESS_API_KEY }}
        run: python -m civic_tracker.daily_federal diagnose
  refresh:
    if: github.ref == 'refs/heads/main' && !inputs.diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.persist.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Recheck official federal sources only
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESSGOV_API || secrets.CONGRESS_API_KEY }}
        run: |
          mkdir -p .local
          sha256sum data/media-inference-*.json data/media-work.json data/collection-state.json > .local/federal-unrelated-before.sha256
          python -m civic_tracker.daily federal
          sha256sum --check .local/federal-unrelated-before.sha256
      - run: python -m civic_tracker.privacy
      - run: python -m civic_tracker.browse --output .local/site
      - name: Persist reports and source receipts before publication
        id: persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Recheck federal public records and retain prior failure receipt'
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject publication of an outdated artifact
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SHA: ${{ needs.refresh.outputs.source_sha }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "active=$([ "$latest" = "$ARTIFACT_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish corrected federal website artifact
        if: steps.current.outputs.active == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
